[project]
name = "voice-support-agent"
version = "0.1.0"
description = "Customer support agent with a framework-free tool-calling loop and a fake CRM"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.162.0",
    "openai>=3.42.1",
    "uvicorn>=0.54.0",
]

[project.optional-dependencies]
voice = [
    "av>=17.1.0",
    "faster-whisper>=1.2.1",
    "numpy>=2.2.6",
    "piper-tts>=1.8.0",
]
mcp = [
    "mcp>=2.3.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
